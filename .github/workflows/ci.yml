name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig fmt --check src tests bench examples build.zig
      - run: zig build test --summary all
      - run: zig build test -Doptimize=ReleaseSafe --summary all
      - run: zig build test -Doptimize=ReleaseFast --summary all
      - run: zig build example

  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
      - run: sh tools/oracle/setup.sh
      - name: Regenerate fixtures from BedSim
        working-directory: tools/oracle
        run: go run . -out ../../tests/fixtures/bedsim.json
      - name: Fixtures must match the committed set
        run: git diff --exit-code -- tests/fixtures/bedsim.json
